name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv e Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sincronizar dependências
        run: uv sync --frozen --all-groups

      - name: Ruff
        run: uv run ruff check .

      - name: Formato
        run: uv run ruff format --check .

      - name: Testes
        run: uv run pytest

      - name: Avaliação com o provider mock
        run: uv run python -m pergunteoee.eval.run --provider mock --out /tmp/eval-mock.json
