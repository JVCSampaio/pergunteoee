[project]
name = "pergunteoee"
version = "0.1.0"
description = "Agente text-to-SQL em português para OEE, produção e paradas de uma fábrica de panificação sintética."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "João Vitor Sampaio" }]
dependencies = [
    "duckdb>=1.1.3",
    "openai>=1.54",
    "pandas>=2.2",
    "plotly>=5.24",
    "pyyaml>=6.0",
    "sqlglot>=26.0",
    "streamlit>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
pergunteoee-dados = "pergunteoee.data.generate:main"
pergunteoee-eval = "pergunteoee.eval.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pergunteoee"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = [".", "src"]
